                                <input type="date" v-model="dueDate" class="form-control">
                            </div>
                            <button class="btn-primary" @click="saveMemo">Add Memo</button>
                        </div>
                        <div class="card-box" v-if="memos.length">
                            <h3>Active Memos</h3>
                            <div v-for="(m, i) in memos" :key="i" style="margin-top:10px; border-bottom:1px solid var(--border-color); padding-bottom:8px;">
                                <p><strong>{{ m.name }}</strong>: \${{ m.amount }}</p>
                                <p style="font-size:13px; color:var(--text-secondary);">Due: {{ m.dueDate }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const name = ref('');
                const amount = ref('');
                const dueDate = ref('');
                const memos = ref(JSON.parse(localStorage.getItem('credit_memos') || '[]'));

                function saveMemo() {
                    if (!name.value || !amount.value) return;
                    memos.value.push({ name: name.value, amount: amount.value, dueDate: dueDate.value });
                    localStorage.setItem('credit_memos', JSON.stringify(memos.value));
                    name.value = '';
                    amount.value = '';
                    dueDate.value = '';
                    showToast('Memo added');
                }
                return { name, amount, dueDate, memos, saveMemo };
            }
        };

        // 4. Settings Component
        const SettingsComp = {
            template: `
                <div>
                    <div class="app-header">
                        <h1>Settings</h1>
                        <span style="font-size: 13px; opacity: 0.9;">Profile & Info</span>
                    </div>
                    <div style="padding: 16px 0;">
                        <div class="menu-list">
                            <router-link to="/settings/version" class="menu-item">
                                <span>Version Information</span>
                                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                            </router-link>
                            <router-link to="/settings/privacy" class="menu-item">
                                <span>Privacy Policy</span>
                                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                            </router-link>
                            <router-link to="/settings/terms" class="menu-item">
                                <span>Terms of Service</span>
                                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                            </router-link>
                            <router-link to="/settings/team" class="menu-item">
                                <span>About Team</span>
                                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                            </router-link>
                            <a href="mailto:com.bintangcode.textstylegenerator@gmail.com" class="menu-item">
                                <span>Contact Us</span>
                                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                            </a>
                            <router-link to="/settings/checkin" class="menu-item">
                                <span>Monthly Check-in</span>
                                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                            </router-link>
                            <router-link to="/settings/feedback" class="menu-item">
                                <span>Customer Feedback</span>
                                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                            </router-link>
                            <router-link to="/settings/inbox" class="menu-item">
                                <span>Inbox Messages</span>
                                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                            </router-link>
                        </div>
                    </div>
                </div>
            `
        };

        // Setting Subpages
        const VersionComp = {
            template: `
                <div class="page-container no-tab" style="padding-bottom:20px;">
                    <div class="app-header">
                        <button class="back-btn" @click="$router.back()">‹ Back</button>
                        <h1>Version</h1>
                        <div style="width: 40px;"></div>
                    </div>
                    <div class="sub-content">
                        <div class="card-box" style="text-align: center; padding: 30px 16px;">
                            <h2>AO TVG DMA</h2>
                            <p style="color: var(--text-secondary); margin-top: 6px;">Version 2.4.0 (Build 2026)</p>
                            <p style="margin-top: 16px; font-size: 14px;">Running on secure standalone Webview architecture.</p>
                        </div>
                    </div>
                </div>
            `
        };

        const PrivacyComp = {
            template: `
                <div class="page-container no-tab" style="padding-bottom:20px;">
                    <div class="app-header">
                        <button class="back-btn" @click="$router.back()">‹ Back</button>
                        <h1>Privacy Policy</h1>
                        <div style="width: 40px;"></div>
                    </div>
                    <div class="sub-content">
                        <div class="card-box">
                            <h3 style="margin-bottom:8px;">Data Collection & Security</h3>
                            <p style="color: var(--text-secondary); margin-bottom: 10px;">We respect your privacy. All analytical calculations and financial tools execute locally within your browser environment.</p>
                            <p style="color: var(--text-secondary);">No personal financial records are transmitted or stored on external servers.</p>
                        </div>
                    </div>
                </div>
            `
        };

        const TermsComp = {
            template: `
                <div class="page-container no-tab" style="padding-bottom:20px;">
                    <div class="app-header">
                        <button class="back-btn" @click="$router.back()">‹ Back</button>
                        <h1>Terms of Service</h1>
                        <div style="width: 40px;"></div>
                    </div>
                    <div class="sub-content">
                        <div class="card-box">
                            <h3 style="margin-bottom:8px;">Usage Terms</h3>
                            <p style="color: var(--text-secondary); margin-bottom: 10px;">By accessing AO TVG DMA, you agree to utilize market tools for informational purposes.</p>
                            <p style="color: var(--text-secondary);">All calculations are provided as-is without financial advisory guarantees.</p>
                        </div>
                    </div>
                </div>
            `
        };

        const TeamComp = {
            template: `
                <div class="page-container no-tab" style="padding-bottom:20px;">
                    <div class="app-header">
                        <button class="back-btn" @click="$router.back()">‹ Back</button>
                        <h1>About Team</h1>
                        <div style="width: 40px;"></div>
                    </div>
                    <div class="sub-content">
                        <div class="card-box">
                            <h3 style="margin-bottom:8px;">Engineering Excellence</h3>
                            <p style="color: var(--text-secondary);">Built by dedicated mobile web engineers focused on robust offline-first architecture and high-performance cross-platform webview solutions.</p>
                        </div>
                    </div>
                </div>
            `
        };

        const CheckinComp = {
            template: `
                <div class="page-container no-tab" style="padding-bottom:20px;">
                    <div class="app-header">
                        <button class="back-btn" @click="$router.back()">‹ Back</button>
                        <h1>Monthly Check-in</h1>
                        <div style="width: 40px;"></div>
                    </div>
                    <div class="sub-content">
                        <div class="card-box" style="text-align: center;">
                            <button class="btn-primary" @click="doCheckin" style="margin-bottom: 16px;">Check In Today</button>
                            <div class="calendar-grid">
                                <div v-for="day in 30" :key="day" :class="['cal-cell', checkedDays.includes(day) ? 'checked' : '']">
                                    {{ day }}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const checkedDays = ref(JSON.parse(localStorage.getItem('checked_days') || '[5, 12]'));

                function doCheckin() {
                    const today = new Date().getDate();
                    if (!checkedDays.value.includes(today)) {
                        checkedDays.value.push(today);
                        localStorage.setItem('checked_days', JSON.stringify(checkedDays.value));
                        showToast('Check-in successful!');
                    } else {
                        showToast('Already checked in today.');
                    }
                }
                return { checkedDays, doCheckin };
            }
        };

        const FeedbackComp = {
            template: `
                <div class="page-container no-tab" style="padding-bottom:20px;">
                    <div class="app-header">
                        <button class="back-btn" @click="$router.back()">‹ Back</button>
                        <h1>Feedback</h1>
                        <div style="width: 40px;"></div>
                    </div>
                    <div class="sub-content">
                        <div class="card-box">
                            <div class="form-group">
                                <label>Title</label>
                                <input type="text" v-model="title" class="form-control" placeholder="Subject">
                            </div>
                            <div class="form-group">
                                <label>Message</label>
                                <textarea v-model="message" class="form-control" rows="4" placeholder="Your feedback..."></textarea>
                            </div>
                            <button class="btn-primary" :disabled="!isValid" @click="submit">Send Feedback</button>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const router = VueRouter.useRouter();
                const title = ref('');
                const message = ref('');

                const isValid = computed(() => title.value.trim() && message.value.trim());

                function submit() {
                    if (!isValid.value) return;
                    showToast('Feedback sent successfully');
                    title.value = '';
                    message.value = '';
                    setTimeout(() => router.back(), 1000);
                }
                return { title, message, isValid, submit };
            }
        };

        const InboxComp = {
            template: `
                <div class="page-container no-tab" style="padding-bottom:20px;">
                    <div class="app-header">
                        <button class="back-btn" @click="$router.back()">‹ Back</button>
                        <h1>Inbox</h1>
                        <div style="width: 40px;"></div>
                    </div>
                    <div class="sub-content">
                        <div class="card-box" @click="showAlert" style="cursor: pointer;">
                            <h3>Welcome to AO TVG DMA</h3>
                            <p style="font-size:13px; color:var(--text-secondary); margin-top:6px;">Tap to read message details...</p>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                function showAlert() {
                    alert('Welcome to AO TVG DMA! Enjoy secure offline-first financial tools and market analytics.');
                }
                return { showAlert };
            }
        };

        // Router Configuration
        const routes = [
            { path: '/', component: LoadingComp },
            {
                path: '/',
                component: MainLayout,
                children: [
                    { path: 'home', component: HomeComp },
                    { path: 'toolbox', component: ToolboxComp },
                    { path: 'settings', component: SettingsComp }
                ]
            },
            { path: '/detail', component: DetailComp },
            { path: '/sub/:type', component: SubCategoryComp },
            { path: '/tool/dca', component: ToolDCAComp },
            { path: '/tool/calendar', component: ToolCalendarComp },
            { path: '/tool/loan', component: ToolLoanComp },
            { path: '/tool/profit', component: ToolProfitComp },
            { path: '/tool/reverse', component: ToolReverseComp },
            { path: '/tool/password', component: ToolPasswordComp },
            { path: '/tool/credit', component: ToolCreditComp },
            { path: '/settings/version', component: VersionComp },
            { path: '/settings/privacy', component: PrivacyComp },
            { path: '/settings/terms', component: TermsComp },
            { path: '/settings/team', component: TeamComp },
            { path: '/settings/checkin', component: CheckinComp },
            { path: '/settings/feedback', component: FeedbackComp },
            { path: '/settings/inbox', component: InboxComp }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        const app = createApp({
            template: `
                <router-view></router-view>
                <div v-if="toastMessage" class="toast">{{ toastMessage }}</div>
            `,
            setup() {
                return { toastMessage };
            }
        });

        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
